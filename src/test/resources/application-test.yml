spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:shop_admin_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,ROLE,VALUE
    username: sa
    password:
    hikari:
      maximum-pool-size: 4
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    jdbc-type-for-null: NULL
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

security:
  jwt:
    secret: shop-admin-test-jwt-secret-with-at-least-thirty-two-characters
    issuer: shop-admin
    expiration-minutes: 120

app:
  cors:
    allowed-origins:
      - http://localhost:5173
    allow-credentials: true
  upload:
    path: target/test-uploads
    max-file-size: 10MB
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: warn
    com.shop.admin: info
